name: Validate JSON (question-generator)

on:
  push:
    paths:
      - 'questions/**'
      - 'validate_json.py'
  pull_request:
    paths:
      - 'questions/**'
      - 'validate_json.py'
  workflow_dispatch:

jobs:
  validate:
    name: Validate question JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Run JSON validation
        run: python validate_json.py
